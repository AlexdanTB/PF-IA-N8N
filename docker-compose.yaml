services:
  n8n-ia-tp2:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - WEBHOOK_URL=https://caring-freebie-battery.ngrok-free.dev
      - N8N_HOST=caring-freebie-battery.ngrok-free.dev
    volumes:
      - n8n_iatp2_data:/home/node/.n8n
    networks:
      - n8n-iatp2_network
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: always
    networks:
      - n8n-iatp2_network

networks:
  n8n-iatp2_network:

volumes:
  n8n_iatp2_data: